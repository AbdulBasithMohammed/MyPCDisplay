---
# Build orders for the League screen.
#
# WHY THIS FILE EXISTS
#   Riot no longer publishes recommended builds: Data Dragon's `recommended`
#   block and Community Dragon's `recommendedItemDefaults` are both empty, and
#   the sites that derive builds from win rates (op.gg, u.gg, lolalytics) sit
#   behind bot protection. So the ordering below is a plain editable file
#   rather than something fetched.
#
# HOW IT IS USED
#   The screen walks the list, skips anything already in your inventory, and
#   shows the first item you still need - then works down that item's build
#   tree to name the component to buy right now.
#
#   Names must match the in-game shop exactly. Run
#       venv/Scripts/python.exe tools/check_league_builds.py
#   to verify every name against the current patch; it prints anything it
#   cannot resolve and suggests near matches.
#
# EDITING
#   Add or reorder freely. Entries here are overwritten when the app is
#   reinstalled - to keep personal changes across updates, put them in
#   services.yaml under `league: builds:` instead, which is preserved.

# Used when a champion has no entry below. Picked by the champion's own
# attack/magic rating so an unlisted pick still shows something sensible.
defaults:
  ad:
    - Doran's Blade
    - Berserker's Greaves
    - Kraken Slayer
    - Infinity Edge
    - Lord Dominik's Regards
    - Bloodthirster
  ap:
